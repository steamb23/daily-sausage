[package]
name = "daily-sausage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daily budget calculation for Claude subscription weekly usage limits"

[features]
default = []
# Unofficial usage endpoint client (personal-use option, off by default)
oauth = ["dep:ureq"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
png = "0.17"
